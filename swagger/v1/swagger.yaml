---
openapi: 3.0.1
info:
  title: Ticker API V1
  version: v1
  description: API zur Verwaltung von Wettbewerben, Teams, Spielern, Spielen und Live-Tickern.
paths:
  "/api/v1/competitions":
    get:
      summary: list competitions
      tags:
      - Competitions
      security:
      - cookieAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Seitenzahl (aktiviert Pagination)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Einträge pro Seite (1-100, Standard 25)
        schema:
          type: integer
      responses:
        '200':
          description: erfolgreich
    post:
      summary: create competition
      tags:
      - Competitions
      security:
      - cookieAuth: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Muss einer erlaubten Frontend-Origin entsprechen (CSRF-Schutz,
          siehe ApplicationController#verify_origin!).
        schema:
          type: string
      responses:
        '201':
          description: erstellt
        '422':
          description: ungültige Eingabe
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                competition:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      description: STI-Typ, falls verwendet
                  required:
                  - name
  "/api/v1/competitions/{id}":
    parameters:
    - name: id
      in: path
      description: Wettbewerb-ID
