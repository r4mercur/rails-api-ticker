  "/api/v1/teams/{id}/upload_logo":
    parameters:
    - name: id
      in: path
      description: Team-ID
      required: true
      schema:
        type: integer
    post:
      summary: upload team logo
      tags:
      - Teams
      security:
      - cookieAuth: []
      description: Nimmt ein Bild als Base64-Data-URI entgegen (png/jpeg/webp, max.
        5 MB) und speichert es immer als public/images/team_<id>.png, unabhängig vom
        Quellformat.
      parameters:
      - name: Origin
        in: header
        required: true
        description: Muss einer erlaubten Frontend-Origin entsprechen (CSRF-Schutz,
          siehe ApplicationController#verify_origin!).
        schema:
          type: string
      responses:
        '200':
          description: erfolgreich hochgeladen
        '422':
          description: ungültiges oder zu großes Bild
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  description: Base64-Data-URI, z. B. 'data:image/png;base64,...'
              required:
