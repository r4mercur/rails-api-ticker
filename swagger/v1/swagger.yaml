        '200':
          description: erfolgreich
    post:
      summary: create game
      tags:
      - Games
      security:
      - cookieAuth: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Muss einer erlaubten Frontend-Origin entsprechen (CSRF-Schutz,
