  "/api/v1/login":
    post:
      summary: log in
      tags:
      - Sessions
      description: 'Startet eine Cookie-Session. Das Session-Cookie wird per Set-Cookie-Header
        gesetzt und muss vom Client bei Folge-Requests automatisch mitgeschickt werden
        (credentials: ''include'').'
      parameters:
      - name: Origin
        in: header
        required: true
        description: Muss einer erlaubten Frontend-Origin entsprechen (CSRF-Schutz,
          siehe ApplicationController#verify_origin!).
        schema:
          type: string
      responses:
        '200':
          description: erfolgreich eingeloggt
        '401':
          description: ungültige Zugangsdaten
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
              - email
              - password
  "/api/v1/logout":
