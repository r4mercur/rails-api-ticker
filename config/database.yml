# Development and test keep using SQLite (zero local setup).
# Production runs on PostgreSQL - see the `production` section below.
default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: sqlite3
  timeout: 5000
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  adapter: sqlite3
  timeout: 5000
  database: storage/test.sqlite3

# Configured via a single DATABASE_URL env var, e.g.
#   postgres://user:password@host:5432/ticker_api_production
# This is the convention most hosts (Heroku, Render, Fly.io, ...) provide out of the box.
production:
  <<: *default
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
